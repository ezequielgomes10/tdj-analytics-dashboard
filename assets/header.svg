  <text x="48" y="209" fill="#ffffff" font-family="Arial, sans-serif" font-size="48" font-weight="800">Dashboard<tspan fill="#c9ef72">.</tspan></text>
  <text x="50" y="253" fill="#b2b9a9" font-family="Arial, sans-serif" font-size="18">Inscrições · Projeção · Decisões</text>
