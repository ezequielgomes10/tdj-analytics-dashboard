  <rect x="859" y="244" width="128" height="29" rx="7" fill="#292f24"/><text x="923" y="263" text-anchor="middle" fill="#d9e5c2" font-family="Arial, sans-serif" font-size="11" font-weight="700">RITMO</text>
  <rect x="996" y="244" width="128" height="29" rx="7" fill="#292f24"/><text x="1060" y="263" text-anchor="middle" fill="#d9e5c2" font-family="Arial, sans-serif" font-size="11" font-weight="700">PROJEÇÃO</text>
