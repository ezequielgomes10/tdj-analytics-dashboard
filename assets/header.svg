<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc">
  <title id="title">TDJ Analytics Dashboard</title>
  <desc id="desc">Banner escuro com linha de crescimento e cartões de meta, ritmo e projeção</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#09090b"/><stop offset="1" stop-color="#1b2015"/></linearGradient>
    <linearGradient id="line" x1="0" x2="1"><stop stop-color="#c9ef72"/><stop offset="1" stop-color="#f2c80f"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="330" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="330" rx="26" fill="url(#grid)"/>
  <rect x="48" y="47" width="54" height="54" rx="14" fill="#c9ef72"/>
